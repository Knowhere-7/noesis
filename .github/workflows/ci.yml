name: release-gate

on:
  push:
    branches:
      - master
      - product-kernel-v0.2
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development and build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run the exact v0.2 test gate
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee "${RUNNER_TEMP}/pytest-output.txt"
          grep -Eq '(^|[^0-9])139 passed([^0-9]|$)' "${RUNNER_TEMP}/pytest-output.txt"

      - name: Run and verify the deterministic benchmark
        run: |
          artifact="${RUNNER_TEMP}/noesis-benchmark.json"
          python benchmarks/harness.py --out "${artifact}"
          python benchmarks/verify_results.py "${artifact}" \
            --expected-attacks 13 --expected-benign 8

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify the wheel outside the source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python -I - <<'PY'
          from importlib.resources import files

          import noesis
          from noesis.gateway.retrieval import RetrievalGateway

          dashboard = files("noesis.console").joinpath("dashboard.html")
          assert dashboard.is_file(), "wheel omitted console/dashboard.html"
          print("wheel smoke passed:", noesis.__version__)
          PY
